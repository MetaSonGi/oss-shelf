<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오픈소스 아이디어 선반</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#182b29;font:16px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:56px 24px}header small{letter-spacing:.18em;color:#64756c}h1{font-size:clamp(30px,5vw,54px);margin:12px 0}p{color:#5c6d65}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0}input,select,button,textarea{font:inherit;border:1px solid #b7c4b8;border-radius:9px;padding:10px;background:#fff;color:inherit}input[type=search]{flex:1;min-width:220px}button{cursor:pointer}button:hover{background:#e8eee4}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}article{background:#fffdf7;border:1px solid #d5d9cb;border-radius:16px;padding:24px}h2{margin:8px 0;font-size:25px}a{color:#17604e;text-underline-offset:4px}.tag{font-size:12px;color:#667665}textarea{display:block;width:100%;resize:vertical;margin-top:12px;min-height:85px}label{display:block;margin-top:16px}.foot{font-size:13px;margin-top:30px}#status{min-height:24px}#count{font-weight:600}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ba8324;outline-offset:3px}</style>
<main><header><small>HYOKI / OPEN SOURCE SHELF</small><h1>다음 아이디어가 시작되는 곳.</h1><p>오픈소스 10개에서 나에게 필요한 기능을 찾고, 만들고 싶은 것을 기록하세요.</p></header>
<div class="bar"><input id="query" type="search" aria-label="도구 검색" placeholder="이름, 기능, 아이디어 검색"><select id="category" aria-label="분류"><option value="">모든 분류</option><option>웹</option><option>AI</option><option>음성</option><option>문서</option></select><select id="sort" aria-label="정렬"><option value="original">목록 순서</option><option value="stars">별 많은 순</option><option value="name">이름 순</option></select><button id="export">메모 내보내기</button><button id="import">메모 가져오기</button><input id="file" type="file" accept="application/json,.json" hidden></div><p id="count" aria-live="polite"></p><div id="cards"></div><p id="status" role="status"></p><p class="foot">확인일 2026-11-03 · 별 수는 확인 당시 기준입니다. 체크·메모는 이 브라우저에 저장됩니다.<br>라이선스 원문과 실행 방법은 각 GitHub 저장소에서 확인하세요.</p></main>
<script>
const tools=[{"name": "puck", "repo": "puckeditor/puck", "url": "https://github.com/puckeditor/puck", "category": "웹", "description": "React 드래그앤드롭 페이지 에디터", "idea": "사진전시관 소개 페이지를 편집하는 빌더", "stars": 13606, "license": "MIT"}, {"name": "morphic", "repo": "miurla/morphic", "url": "https://github.com/miurla/morphic", "category": "AI", "description": "생성형 UI를 제공하는 AI 검색엔진", "idea": "미디어아트 자료를 찾아 답변하는 검색 서비스", "stars": 9257, "license": "Apache-2.0"}, {"name": "moonshine", "repo": "moonshine-ai/moonshine", "url": "https://github.com/moonshine-ai/moonshine", "category": "음성", "description": "음성 에이전트·인터페이스용 음성 처리", "idea": "로봇랩 음성 명령 인터페이스", "stars": 11387, "license": "NOASSERTION"}, {"name": "unstract", "repo": "Zipstack/unstract", "url": "https://github.com/Zipstack/unstract", "category": "문서", "description": "비정형 문서를 구조화 데이터로 추출", "idea": "신청서·작품 설명서를 표준 데이터로 정리", "stars": 7405, "license": "AGPL-3.0"}, {"name": "pdfme", "repo": "pdfme/pdfme", "url": "https://github.com/pdfme/pdfme", "category": "문서", "description": "템플릿 디자이너가 있는 PDF 생성 라이브러리", "idea": "전시 도록·작품 캡션·수료증 생성기", "stars": 4983, "license": "MIT"}, {"name": "docetl", "repo": "ucbepic/docetl", "url": "https://github.com/ucbepic/docetl", "category": "문서", "description": "LLM 기반 대량 문서 처리 파이프라인", "idea": "여러 연구 문서의 주제·인사이트 추출", "stars": 4190, "license": "MIT"}, {"name": "assistant-ui", "repo": "assistant-ui/assistant-ui", "url": "https://github.com/assistant-ui/assistant-ui", "category": "AI", "description": "React·TypeScript AI 채팅 UI 컴포넌트", "idea": "전시 도슨트·프로젝트 도움말 채팅창", "stars": 12919, "license": "MIT"}, {"name": "OpnForm", "repo": "OpnForm/OpnForm", "url": "https://github.com/OpnForm/OpnForm", "category": "웹", "description": "오픈소스 폼 빌더", "idea": "전시 참가 신청·관람객 피드백 폼", "stars": 3972, "license": "NOASSERTION"}, {"name": "LitServe", "repo": "Lightning-AI/LitServe", "url": "https://github.com/Lightning-AI/LitServe", "category": "AI", "description": "Python AI 추론 API 서버 프레임워크", "idea": "로컬 이미지·음성 모델의 API 서비스", "stars": 3980, "license": "Apache-2.0"}, {"name": "next-forge", "repo": "vercel/next-forge", "url": "https://github.com/vercel/next-forge", "category": "웹", "description": "Turborepo 기반 Next.js 앱 템플릿", "idea": "작은 구독형 콘텐츠 제작 서비스", "stars": 7726, "license": "MIT"}];
const $=id=>document.getElementById(id),key='hyoki.oss-shelf.v1';let notes={};
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))notes=saved;}catch(e){$('status').textContent='저장된 메모를 읽지 못했습니다. 내보낸 파일이 있으면 가져오세요.';}
function save(){try{localStorage.setItem(key,JSON.stringify(notes));$('status').textContent='이 브라우저에 저장했습니다.';}catch(e){$('status').textContent='브라우저 저장에 실패했습니다. 메모 내보내기를 사용하세요.';}}
function render(){let list=tools.filter(t=>(!$('category').value||t.category===$('category').value)&&[t.name,t.repo,t.description,t.idea].join(' ').toLowerCase().includes($('query').value.toLowerCase()));if($('sort').value==='stars')list.sort((a,b)=>b.stars-a.stars);if($('sort').value==='name')list.sort((a,b)=>a.name.localeCompare(b.name));$('count').textContent=`${list.length}개의 아이디어`;$('cards').replaceChildren();for(const t of list){const a=document.createElement('article');a.innerHTML='<div class="tag"></div><h2><a target="_blank" rel="noopener noreferrer"></a></h2><p></p><strong></strong><label><input type="checkbox"> 확인했어요</label><textarea placeholder="이 도구로 만들고 싶은 것…"></textarea>';a.querySelector('.tag').textContent=`${t.category} · ★ ${t.stars.toLocaleString()} · ${t.license==='NOASSERTION'?'라이선스 원문 확인':t.license}`;const link=a.querySelector('a');link.href=t.url;link.textContent=t.name;a.querySelector('p').textContent=t.description;a.querySelector('strong').textContent=t.idea;const check=a.querySelector('input'),memo=a.querySelector('textarea');check.checked=!!notes[t.repo]?.checked;memo.value=notes[t.repo]?.memo||'';memo.setAttribute('aria-label',t.name+' 개인 메모');const update=()=>{notes[t.repo]={checked:check.checked,memo:memo.value};save();};check.onchange=update;memo.oninput=update;$('cards').append(a);}}
for(const id of ['query','category','sort'])$(id).addEventListener(id==='query'?'input':'change',render);
$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:1,notes},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='oss-shelf-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;const d=JSON.parse(await f.text());if(d.version!==1||!d.notes||typeof d.notes!=='object')throw Error();for(const t of tools){const n=d.notes[t.repo];if(n&&typeof n.memo==='string'&&typeof n.checked==='boolean')notes[t.repo]={memo:n.memo,checked:n.checked};}save();render();}catch(e){$('status').textContent='메모 파일 형식을 확인하세요.';}$('file').value='';};render();
</script></html>
